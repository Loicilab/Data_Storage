<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Store</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6fed' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M12 3 3 7.5 12 12l9-4.5z'/%3E%3Cpath d='m3 12 9 4.5 9-4.5'/%3E%3Cpath d='m3 16.5 9 4.5 9-4.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3 3 7.5 12 12l9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3"/></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12"/><path d="m6 10 6 6 6-6"/><path d="M4 20h16"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m6 6 1 14h10l1-14"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-shield-alert" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M12 8v4M12 16h.01"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H7a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 11a4 4 0 0 1-2 8z"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
      <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><svg class="icon"><use href="#i-logo"/></svg><span>Data Store</span></div>
      <nav class="nav" id="nav">
        <a href="#/files" data-nav="files"><svg class="icon"><use href="#i-folder"/></svg>Files</a>
        <a href="#/photos" data-nav="photos"><svg class="icon"><use href="#i-image"/></svg>Photos</a>
        <a href="#/storage" data-nav="storage"><svg class="icon"><use href="#i-database"/></svg>Storage</a>
        <a href="#/accounts" data-nav="accounts"><svg class="icon"><use href="#i-cloud"/></svg>Accounts</a>
        <a href="#/activity" data-nav="activity"><svg class="icon"><use href="#i-activity"/></svg>Activity</a>
        <a href="#/trash" data-nav="trash"><svg class="icon"><use href="#i-trash"/></svg>Trash<span class="nav-count" id="trash-count"></span></a>
      </nav>
      <div class="health" id="health"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menu-btn" title="Menu"><svg class="icon"><use href="#i-menu"/></svg></button>
        <div class="crumbs" id="crumbs"></div>
        <form class="search" id="search-form" role="search">
          <svg class="icon"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search all files" autocomplete="off">
        </form>
        <div class="actions" id="actions"></div>
      </header>
      <div class="content" id="content"><section id="view" class="view"></section></div>
    </main>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <div class="dropzone" id="dropzone"><div class="dropzone-inner"><svg class="icon"><use href="#i-upload"/></svg><p id="dropzone-text">Drop to upload</p></div></div>

  <section class="transfers" id="transfers" hidden>
    <header><strong id="transfers-title">Uploads</strong><button class="link-btn" id="transfers-clear">Clear finished</button><button class="icon-btn sm" id="transfers-toggle" title="Collapse"><svg class="icon"><use href="#i-chev-right"/></svg></button></header>
    <ul id="transfers-list"></ul>
  </section>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-btn lb-close" data-lb="close" title="Close (Esc)"><svg class="icon"><use href="#i-x"/></svg></button>
    <button class="lb-btn lb-prev" data-lb="prev" title="Previous (←)"><svg class="icon"><use href="#i-chev-left"/></svg></button>
    <figure class="lb-stage" id="lb-stage"></figure>
    <button class="lb-btn lb-next" data-lb="next" title="Next (→)"><svg class="icon"><use href="#i-chev-right"/></svg></button>
    <div class="lb-caption" id="lb-caption"></div>
  </div>

  <dialog class="modal" id="modal"></dialog>
  <div class="toasts" id="toasts"></div>
  <input type="file" id="file-input" multiple hidden>
  <input type="file" id="folder-input" webkitdirectory multiple hidden>
  <input type="file" id="conf-input" hidden>

  <script src="/app.js"></script>
</body>
</html>
